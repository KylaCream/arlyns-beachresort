<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Arlyn's Beach Resort</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --lagoon-deep: #0e3f41; --lagoon-mid: #17706c; --lagoon-bright: #2f9c93;
    --sand-light: #faf5e6; --coral: #e8724c; --coral-dark: #c85a37;
    --driftwood: #362e26; --foam: #fffdf8; --line: rgba(14,63,65,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Work Sans', sans-serif;
    background: linear-gradient(160deg, var(--lagoon-deep) 0%, var(--lagoon-mid) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--foam);
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.5);
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--lagoon-deep);
    margin-bottom: 4px;
  }
  .logo span { color: var(--coral); }
  h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.3rem;
    color: var(--lagoon-deep);
    margin: 18px 0 6px;
  }
  p.sub { color: var(--driftwood); opacity: 0.7; margin: 0 0 28px; font-size: 0.92rem; }
  label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--lagoon-deep); margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    font-family: 'Work Sans', sans-serif;
    font-size: 0.95rem;
    margin-bottom: 18px;
    background: var(--sand-light);
    color: var(--driftwood);
  }
  input:focus { outline: none; border-color: var(--lagoon-bright); }
  button {
    width: 100%;
    padding: 13px;
    border-radius: 999px;
    border: none;
    background: var(--coral);
    color: var(--foam);
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.2s ease;
  }
  button:hover { background: var(--coral-dark); transform: translateY(-1px); }
  button:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
  .error {
    display: none;
    background: rgba(200,90,55,0.1);
    color: var(--coral-dark);
    border: 1px solid rgba(200,90,55,0.3);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    margin-bottom: 18px;
  }
  .error.show { display: block; }
  .back { display: inline-block; margin-top: 22px; font-size: 0.85rem; color: var(--lagoon-mid); text-decoration: none; }
  .back:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Arlyn's<span>.</span></div>
    <h1>Admin Login</h1>
    <p class="sub">Sign in to manage booking requests.</p>

    <div class="error" id="error-box"></div>

    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />

      <button type="submit" id="submit-btn">Log In</button>
    </form>

    <a class="back" href="/index.html">&larr; Back to the resort site</a>
  </div>

<script>
  const form = document.getElementById('login-form');
  const errorBox = document.getElementById('error-box');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed.');

      window.location.href = '/admin.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add('show');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });
</script>
</body>
</html>
